<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pa-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0b100d' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="PropertyArena.ng is Nigeria's property marketplace. Buy, rent, sell and request homes, land and commercial property from verified agents and developers." />
    <meta property="og:title" content="PropertyArena.ng — Find. Compare. Own." />
    <meta property="og:description" content="Buy, rent, sell and request property across Nigeria." />
    <meta property="og:image" content="/logo.png" />
    <title>PropertyArena.ng — Find. Compare. Own.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
